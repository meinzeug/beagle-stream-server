name: BeagleStream Server Release

on:
  push:
    branches:
      - beagle/phase-a
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beagle-stream-server-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BEAGLE_RELEASE_VERSION: "1.0.0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Resolve release version
        id: version
        run: |
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          build_version="${BEAGLE_RELEASE_VERSION}"
          release_tag="beagle-v${build_version}-${short_sha}"
          echo "build_version=${build_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_title=BeagleStream Server ${build_version} (${short_sha})" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

  build-deb:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BRANCH: beagle/phase-a
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            dpkg-dev \
            fakeroot \
            glslang-tools \
            git \
            libayatana-appindicator3-dev \
            libcap-dev \
            libcurl4-openssl-dev \
            libdrm-dev \
            libevdev-dev \
            libgbm-dev \
            libminiupnpc-dev \
            libnotify-dev \
            libnuma-dev \
            libopus-dev \
            libpulse-dev \
            libssl-dev \
            libva-dev \
            libvdpau-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri3-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxtst-dev \
            ninja-build \
            nodejs \
            npm \
            pkg-config \
            libpipewire-0.3-dev \
            libinput-dev

      - name: Configure
        run: |
          cmake -S . -B build/beagle-release -G Ninja \
            -DBEAGLE_INTEGRATION=ON \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF \
            -DSUNSHINE_ENABLE_PORTAL=OFF \
            -DSUNSHINE_ENABLE_TRAY=ON

      - name: Build
        run: cmake --build build/beagle-release --target sunshine -j"$(nproc)"

      - name: Verify Beagle binary name
        run: |
          test -x build/beagle-release/beagle-stream-server
          test ! -e build/beagle-release/sunshine

      - name: Package DEB
        run: |
          cmake --build build/beagle-release --target web-ui -j"$(nproc)"
          cpack -G DEB --config build/beagle-release/CPackConfig.cmake
          dpkg-deb -c build/beagle-release/cpack_artifacts/*.deb | tee /tmp/beagle-stream-server-deb-contents.txt
          grep -q './usr/bin/beagle-stream-server$' /tmp/beagle-stream-server-deb-contents.txt
          if grep -q './usr/bin/sunshine$' /tmp/beagle-stream-server-deb-contents.txt; then
            echo "BeagleStream package must not install /usr/bin/sunshine" >&2
            exit 1
          fi
          mkdir -p dist
          deb="$(find build/beagle-release/cpack_artifacts -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$deb"
          cp "$deb" "dist/beagle-stream-server-${{ needs.version.outputs.build_version }}-ubuntu-24.04-amd64.deb"
          cp "$deb" "dist/beagle-stream-server-latest-ubuntu-24.04-amd64.deb"
          sha256sum dist/*.deb > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: beagle-stream-server-release-${{ needs.version.outputs.short_sha }}
          path: dist/*

  publish:
    needs:
      - version
      - build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: beagle-stream-server-release-${{ needs.version.outputs.short_sha }}
          path: dist/

      - name: Publish immutable Beagle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.version.outputs.release_tag }}"
          title="${{ needs.version.outputs.release_title }}"
          notes="BeagleStream Server ${tag} built from ${GITHUB_SHA}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber dist/*.deb dist/SHA256SUMS
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" dist/*.deb dist/SHA256SUMS \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
